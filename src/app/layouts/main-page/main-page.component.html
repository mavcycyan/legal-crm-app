<div class="main-page">
  <div class="main-page-container">
    <div [ngClass]="{'main-page-menu': true, 'active': mobMenuState}">
      <div class="main-page-mob_btn">
        <button [ngClass]="{'active': mobMenuState}" (click)="mobMenuAction(!mobMenuState)">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="main-page-name">Вітаю, {{name}}</div>
      <div class="main-page-url">
        <a [routerLink]="['']" (click)="mobMenuAction(!mobMenuState)">Головна</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['users']" (click)="mobMenuAction(!mobMenuState)">Користувачі</a>
        <a *ngIf="userType === '1' || userType === '2' || userType === '3'" [routerLink]="['lawyer', 'clients']" (click)="mobMenuAction(!mobMenuState)">Клієнти</a>
        <a *ngIf="userType === '4'" [routerLink]="['advocate', 'clients']" (click)="mobMenuAction(!mobMenuState)">Клієнти</a>
        <a *ngIf="userType === '1' || userType === '2' || userType === '3'" [routerLink]="['lawyer', 'subscribers']" (click)="mobMenuAction(!mobMenuState)">Абоненти</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['advocate']" (click)="mobMenuAction(!mobMenuState)">Адвокат</a>
        <a *ngIf="userType === '4'" [routerLink]="['advocate', 'personal']" (click)="mobMenuAction(!mobMenuState)">Справи</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['archive', 'clients']" (click)="mobMenuAction(!mobMenuState)">Архів клієнтів</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['archive', 'subscribers']" (click)="mobMenuAction(!mobMenuState)">Архів абонентів</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['archive', 'advocate_cases']" (click)="mobMenuAction(!mobMenuState)">Архів справ адвокатів</a>
        <a *ngIf="userType === '1' || userType === '2'" [routerLink]="['calculations', 'subscribers']" (click)="mobMenuAction(!mobMenuState)">Звітна таблиця (абоненти)</a>
        <button type="button" (click)="logout()">Вийти з системи</button>
      </div>
    </div>
    <div class="main-page-wrap">
      <router-outlet></router-outlet>
      <div *ngIf="preloader" class="main-page-preloader">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><radialGradient id="a12" cx=".66" fx=".66" cy=".3125" fy=".3125" gradientTransform="scale(1.5)"><stop offset="0" stop-color="#4C5D52"></stop><stop offset=".3" stop-color="#4C5D52" stop-opacity=".9"></stop><stop offset=".6" stop-color="#4C5D52" stop-opacity=".6"></stop><stop offset=".8" stop-color="#4C5D52" stop-opacity=".3"></stop><stop offset="1" stop-color="#4C5D52" stop-opacity="0"></stop></radialGradient><circle transform-origin="center" fill="none" stroke="url(#a12)" stroke-width="15" stroke-linecap="round" stroke-dasharray="200 1000" stroke-dashoffset="0" cx="100" cy="100" r="70"><animateTransform type="rotate" attributeName="transform" calcMode="spline" dur="2" values="360;0" keyTimes="0;1" keySplines="0 0 1 1" repeatCount="indefinite"></animateTransform></circle><circle transform-origin="center" fill="none" opacity=".2" stroke="#4C5D52" stroke-width="15" stroke-linecap="round" cx="100" cy="100" r="70"></circle></svg>
      </div>
    </div>
  </div>
</div>
