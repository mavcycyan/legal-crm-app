<div class="user_case_wrap">
  <div class="user_case_card">
    <div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Ім'я</div>
        <div class="user_case_card-col">{{user.name}}</div>
      </div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Email</div>
        <div class="user_case_card-col">{{user.email}}</div>
      </div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Дата народження</div>
        <div class="user_case_card-col">{{user.birthday}}</div>
      </div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Телефон</div>
        <div class="user_case_card-col">{{user.phone}}</div>
      </div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Адреса</div>
        <div class="user_case_card-col">{{user.address}}</div>
      </div>
      <div class="user_case_card-row">
        <div class="user_case_card-col">Роль</div>
        <div class="user_case_card-col">{{user.role_id | rolename}}</div>
      </div>
    </div>
  </div>
</div>
