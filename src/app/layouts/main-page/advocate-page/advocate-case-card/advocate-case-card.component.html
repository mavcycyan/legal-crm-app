<div class="advocate_case_card">
  <div>
    <div class="advocate_case_card-row">
      <div class="advocate_case_card-col">Дата звернення</div>
      <div class="advocate_case_card-col">{{case.visit_date}}</div>
    </div>
    <div class="advocate_case_card-row">
      <div class="advocate_case_card-col">Номер справи</div>
      <div class="advocate_case_card-col">{{case.proc_num}}</div>
    </div>
    <div class="advocate_case_card-row">
      <div class="advocate_case_card-col">Фабула</div>
      <div class="advocate_case_card-col">{{case.plot}}</div>
    </div>
    <div class="advocate_case_card-row">
      <div class="advocate_case_card-col">Гонорар</div>
      <div class="advocate_case_card-col">{{case.fee}}</div>
    </div>
    <div class="advocate_case_card-row">
      <div class="advocate_case_card-col">Статус</div>
      <div class="advocate_case_card-col">{{case.result | statuswork}}</div>
    </div>
  </div>
</div>

<app-table-card [data]="works" [columns]="tblColumns"></app-table-card>

<div class="main-page-btn">
  <a [routerLink]="['/', 'edit', 'advocate_case', id]">Редагувати категорію</a>
  <a [routerLink]="['/', 'edit', 'advocate_work']" class="second">Додати справу</a>
</div>
