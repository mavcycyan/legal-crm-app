<div class="tableincom-tbl">
  <div class="tableincom-tbl-head">
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Назва</div>
      <div class="tableincom-tbl-col">Інформація</div>
    </div>
  </div>
  <div class="tableincom-tbl-body">
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Дата звернення</div>
      <div class="tableincom-tbl-col">{{case.visit_date}}</div>
    </div>
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Номер справи</div>
      <div class="tableincom-tbl-col">{{case.proc_num}}</div>
    </div>
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Фабула</div>
      <div class="tableincom-tbl-col">{{case.plot}}</div>
    </div>
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Гонорар</div>
      <div class="tableincom-tbl-col">{{case.fee}}</div>
    </div>
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Статус</div>
      <div class="tableincom-tbl-col">{{case.result}}</div>
    </div>
  </div>
</div>

<div class="tableincom-tbl" *ngFor="let work of works">
  <div class="tableincom-tbl-head">
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Назва</div>
      <div class="tableincom-tbl-col">Інформація</div>
    </div>
  </div>
  <div class="tableincom-tbl-body">
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Що зроблено</div>
      <div class="tableincom-tbl-col">
        <div *ngFor="let item of work.what_done; index as i;">
          <div [ngClass]="{'text-red': item.pending === true}">{{i + 1}}. {{item.data}}</div>
        </div>
      </div>
    </div>
    <div class="tableincom-tbl-row">
      <div class="tableincom-tbl-col">Результат</div>
      <div class="tableincom-tbl-col">{{work.result}}</div>
    </div>
  </div>
</div>
