<div *ngIf="responseType === 'cases'" class="main-page-wrap-in">
  <app-search-form [field]="'plot'" [placeholder]="'Почніть вводити фабулу справи'" (updatePage)="getList($event)"></app-search-form>
  <app-table [data]="cases" [columns]="tblColumns" [tableClass]="'advcase-works-list'" [tablePaymentService]="advocateCasePaymentsService" [advCaseService]="advocateCaseTblService"></app-table>
  <app-pagination *ngIf="allItems > 0" [allItems]="allItems" [pageSize]="pageSize" (updatePage)="getList($event)"></app-pagination>

  <div class="main-page-btn">
    <a [routerLink]="['/', 'edit', 'advocate_category', id]">Редагувати категорію</a>
    <a [routerLink]="['/', 'edit', 'advocate_case']" class="second">Додати справу</a>
  </div>
  <app-filter (updatePage)="getList($event)" [sort]="sortVars" [filter]="filterVars"></app-filter>
</div>

<div *ngIf="responseType === 'subcategories'" class="main-page-wrap-in">
  <app-advocate-subcategories [id]="id" [advocateId]="advId" [categories]="subcategories"></app-advocate-subcategories>
</div>
