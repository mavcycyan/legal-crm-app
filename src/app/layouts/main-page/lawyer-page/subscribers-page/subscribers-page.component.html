<div class="main-page-wrap-in">
  <app-search-form [field]="'name'" [placeholder]="'Почніть вводити назву підприємтсва'" (updatePage)="getList($event)"></app-search-form>
  <app-table [data]="list" [columns]="tblColumns" [tableClass]="'subscribers-page'" [tablePaymentService]="subscriberPaymentsService" [pageOffset]="pageOffset"></app-table>
  <app-pagination *ngIf="allItems > 0" [allItems]="allItems" [pageSize]="pageSize" (updatePage)="getList($event)"></app-pagination>

  <div class="main-page-btn">
    <a [routerLink]="['/', 'edit', 'lawyer', 'subscribers']">Додати абонента</a>
  </div>
  <app-filter (updatePage)="getList($event)" [sort]="sortVars" [filter]="filterVars"></app-filter>
</div>
