      <app-table-card [data]="works" [columns]="tblColumns"></app-table-card>
    </div>
    <div class="subscriber-sidebar">
      <app-infocard [data]="subscriber" [rows]="subscriberRows" [title]="subscriber.name"></app-infocard>

  </div>
</div>

<div class="main-page-btn">
  <a [routerLink]="['/', 'edit', 'lawyer', 'subscribers', id]">Редагувати абонента</a>
  <a [routerLink]="['/', 'edit', 'lawyer', 'subscriber_work']" class="second">Додати роботу</a>
</div>
