<div class="main-page-wrap-in">
  <app-search-form [field]="'full_name'" [placeholder]="'Почніть вводити ім\'я клієнта'" (updatePage)="getList($event)"></app-search-form>
  <app-table [data]="list" [columns]="tblColumns" [tableClass]="'clients-all-page'" [pageOffset]="pageOffset"></app-table>
  <app-pagination *ngIf="allItems > 0" [allItems]="allItems" [pageSize]="pageSize" (updatePage)="getList($event)"></app-pagination>

  <div class="main-page-btn">
    <a [routerLink]="['/', 'edit', 'lawyer', 'clients']">Додати клієнта</a>
  </div>
</div>
