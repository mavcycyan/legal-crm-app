<div class="filter">
  <div class="filter-btn">
    <button (click)="filterModalOpen()">Фільтр</button>
  </div>
  <div class="filter-modal" *ngIf="modal">
    <div *ngIf="modal" class="filter-modal-overlay" (click)="filterModalClose()" @fadeInOut></div>
    <div *ngIf="modal" class="filter-modal-wrap" @slideRight>
      <h2 class="filter-modal-ttl">Сортування</h2>
      <div class="filter-modal-sort">
        <div class="filter-modal-sort-item">
          <select (change)="refreshData('sort', sortHtml.value)" #sortHtml>
            <option value="" disabled selected>Сортування</option>
            <option *ngFor="let item of sort;" [value]="item.value">{{item.name}}</option>
          </select>
        </div>
      </div>
      <h2 class="filter-modal-ttl">Фільтри</h2>
      <div class="filter-modal-sort" *ngIf="filter.length > 0">
        <div class="filter-modal-sort-item"*ngIf="filter[0].value === 'filt_result'">
          <select (change)="refreshData(filter[0].value, filtHtml.value)" #filtHtml>
            <option value="">{{filter[0].name}}</option>
            <option value="pending">У процесі</option>
            <option value="done">Завершена</option>
            <option value="canceled">Завершена погано</option>
          </select>
        </div>
        <div class="filter-modal-sort-item"*ngIf="filter[0].value === 'filtcust_pending'">
          <select (change)="refreshData(filter[0].value, filtHtml.value)" #filtHtml>
            <option value="">{{filter[0].name}}</option>
            <option value="pending">Роботи у процесі</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
