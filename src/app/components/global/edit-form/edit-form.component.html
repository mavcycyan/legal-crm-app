<div class="edit-form">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="edit-form-row">
      <div *ngFor="let field of fields" [class]="['edit-form-col', field.class]">
        <label [for]="field.slug" class="form-label">{{field.name}}</label>
        <ng-container [ngSwitch]="field.type">
          <input
            *ngSwitchCase="'text'"
            [id]="field.slug"
            [formControlName]="field.slug"
            [type]="field.type"
            class="form-control"
          />
          <input
            *ngSwitchCase="'number'"
            [id]="field.slug"
            [formControlName]="field.slug"
            [type]="field.type"
            class="form-control"
          />
          <input
            *ngSwitchCase="'date'"
            [id]="field.slug"
            [formControlName]="field.slug"
            [type]="field.type"
            class="form-control"
          />
          <select
            *ngSwitchCase="'select'"
            [id]="field.slug"
            [formControlName]="field.slug"
            class="form-control"
          >
            <option *ngFor="let option of field.choises" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
          <select
            *ngSwitchCase="'select_multy'"
            [id]="field.slug"
            [formControlName]="field.slug"
            class="form-control"
            multiple
          >
            <option *ngFor="let option of field.choises" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
          <select
            *ngSwitchCase="'select_status'"
            [id]="field.slug"
            [formControlName]="field.slug"
            class="form-control"
          >
            <option [value]="'pending'">У процесі</option>
            <option [value]="'canceled'">Завершена погано</option>
            <option [value]="'done'">Завершена успішно</option>
          </select>
          <textarea
            *ngSwitchCase="'textarea'"
            [id]="field.name"
            [formControlName]="field.slug"
            class="form-control"
          ></textarea>
          <div
            *ngSwitchCase="'what_done'"
            [id]="field.name"
            [formArrayName]="field.slug"
            class="form-repeater"
          >
            <div *ngFor="let item of whatDone.controls; let i = index" [formGroupName]="i" class="form-repeater-row">
              <div class="form-repeater-bl txt">
                <div class="form-repeater-bl-lbl">Етап:</div>
                <input type="text" formControlName="data" class="form-control" />
              </div>
              <div class="form-repeater-bl pending">
                <div class="form-repeater-bl-lbl">Триває з затримкою ?:</div>
                <select formControlName="pending" class="form-control">
                  <option [ngValue]="true">Так</option>
                  <option [ngValue]="false" selected>Ні</option>
                </select>
              </div>
              <div class="form-repeater-bl remove">
                <button type="button" (click)="removeRepData(i)">&times;</button>
              </div>
            </div>
            <button type="button" (click)="addRepData()" class="btn btn-primary">Додати новий пункт</button>
          </div>
          <div
            *ngSwitchCase="'paymodal'"
          >
            <button type="button" (click)="payModalOpen()" class="btn btn-primary">Редагувати</button>
            <div class="modal" *ngIf="paymodal" @fadeInOut>
              <div class="modal-overlay" (click)="payModalClose()"></div>
              <div class="modal-wrap">
                <app-edit-form-payment [id]="id" [service]="formPaymentsService" [type]="type" (modalState)="payModalAction($event)"></app-edit-form-payment>
              </div>
            </div>
          </div>
          <div
            *ngSwitchCase="'filemodal'"
          >
            <button type="button" (click)="fileModalOpen()" class="btn btn-primary">Прикріпити</button>
            <div class="modal" *ngIf="filemodal" @fadeInOut>
              <div class="modal-overlay" (click)="fileModalClose()"></div>
              <div class="modal-wrap">
                <app-edit-form-files [id]="id" [service]="formFilesService" (modalState)="fileModalAction($event)"></app-edit-form-files>
              </div>
            </div>
          </div>
          <div
            *ngSwitchCase="'password_reset'"
          >
            <div *ngIf="data.role_id !== undefined &&
            (
              (data.role_id !== 1 && data.role_id !== 2) ||
              (
                (data.role_id === 1 || data.role_id === 2) &&
                data.id == sessionStorage.getItem('userId')
              )
            )">
              <button type="button" (click)="passResModalOpen()" class="btn btn-primary">Скинути пароль</button>
              <div class="modal" *ngIf="passresmodal" @fadeInOut>
                <div class="modal-overlay" (click)="passResModalClose()"></div>
                <div class="modal-wrap">
                  <app-edit-form-password-reset [id]="id" [type]="type" (modalState)="passResModalAction($event)"></app-edit-form-password-reset>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
      <div class="edit-form-col w-100">
        <button type="submit" class="btn btn-primary">{{(isEdit) ? 'Зберегти' : 'Створити'}}</button>
        <button *ngIf="isEdit" type="button" class="btn btn-danger" (click)="delete()">Видалити</button>
      </div>
    </div>
  </form>
</div>
