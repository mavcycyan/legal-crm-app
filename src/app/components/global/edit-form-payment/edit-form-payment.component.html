<form [formGroup]="form" (ngSubmit)="submit()" class="edit-form-payment">
  <div class="edit-form-payment-head">Гонорари та платежі</div>
  <div class="edit-form-payment-body">
    <div *ngIf="!pendingModal && prices.length > 0" class="edit-form-payment-wrap" formArrayName="prices">
      <div *ngFor="let price of prices.controls; let i = index;" class="edit-form-payment-row" [formGroupName]="i">
        <div class="edit-form-payment-row-main">
          <div class="edit-form-payment-row-ttl">
            <b>Гонорар</b>
            <span *ngIf="priceList[i].status === 'payed'"> (завершений)</span>
          </div>
          <div class="edit-form-payment-row-dates">
            <div class="edit-form-payment-row-dates-date">
              <label class="form-label">Дата виставлення</label>
              <input type="date" formControlName="date" class="form-control">
            </div>
            <div class="edit-form-payment-row-dates-date">
              <label class="form-label">Дата закриття</label>
              <input type="date" formControlName="date_end" class="form-control">
            </div>
            <div class="edit-form-payment-row-dates-payed">
              <label class="form-label">Сплачений</label>
              <select formControlName="status" class="form-control">
                <option [ngValue]="''" selected>Ні</option>
                <option [ngValue]="'payed'">Так</option>
                <option [ngValue]="'partly'">Частково</option>
              </select>
            </div>
          </div>
          <div [ngClass]="{'edit-form-payment-row-input': true}">
            <input type="hidden" formControlName="id">
            <div>
              <label class="form-label">Гонорар</label>
              <input type="number" formControlName="price" class="form-control" placeholder="сума" style="margin-bottom: 15px">
            </div>
            <div *ngIf="type === 'modified'">
              <label class="form-label" *ngIf="type === 'modified'">Назва гонорара</label>
              <input type="text" formControlName="name" class="form-control" *ngIf="type === 'modified'">
            </div>
          </div>
          <div *ngIf="type === 'modified'" class="edit-form-payment-deadlines">
            <div class="edit-form-payment-deadlines-ttl">Терміни виплат</div>
            <div *ngIf="getDeadlines(i).controls && getDeadlines(i).controls.length > 0" class="edit-form-payment-deadlines-list" formArrayName="deadlines">
              <div class="edit-form-payment-deadlines-list-row">
                <div class="edit-form-payment-deadlines-list-bl">Сума платежу</div>
                <div class="edit-form-payment-deadlines-list-bl">Крайній термін платежу</div>
              </div>
              <div *ngFor="let deadline of getDeadlines(i).controls; let d = index;" class="edit-form-payment-deadlines-list-row" [formGroupName]="d">
                <div class="edit-form-payment-deadlines-list-bl">
                  <input type="number" formControlName="fee" class="form-control">
                </div>
                <div class="edit-form-payment-deadlines-list-bl">
                  <input type="date" formControlName="date" class="form-control">
                </div>
                <div class="edit-form-payment-deadlines-list-row-del">
                  <button type="button" (click)="removeDeadline(i, d)">&times;</button>
                </div>
              </div>
            </div>
            <div class="edit-form-payment-deadlines-list-row-add">
              <button type="button" (click)="addDeadline(i)" class="btn btn-add">Додати термін виплат</button>
            </div>
          </div>
          <div *ngIf="getPayments(i).controls && getPayments(i).controls.length > 0" class="edit-form-payment-sub" formArrayName="payments">
            <div [ngClass]="{'edit-form-payment-sub-row': true, 'edit-form-payment-sub-row-3col': (type === 'modified')}">
              <div *ngIf="type === 'modified'" class="edit-form-payment-sub-bl">Сума платежу у валюті</div>
              <div class="edit-form-payment-sub-bl">Сума платежу</div>
              <div class="edit-form-payment-sub-bl">Дата платежу</div>
            </div>
            <div *ngFor="let pay of getPayments(i).controls; let j = index;" [ngClass]="{'edit-form-payment-sub-row': true, 'edit-form-payment-sub-row-3col': (type === 'modified')}" [formGroupName]="j">
              <div *ngIf="type === 'modified'" class="edit-form-payment-sub-bl">
                <div class="form-control-am_cur">
                  <input type="number" formControlName="amount_currency" class="form-control" (input)="inputAmountCur(i, j, $event)">
                  <select formControlName="amount_currency_val" (change)="changeAmountCur(i, j, $event)">
                    <option value=""></option>
                    <option value="EUR">€</option>
                    <option value="USD">$</option>
                  </select>
                </div>
              </div>
              <div class="edit-form-payment-sub-bl">
                <input type="hidden" formControlName="id">
                <input type="number" formControlName="amount" class="form-control">
              </div>
              <div class="edit-form-payment-sub-bl">
                <input *ngIf="type !== 'modified'" type="date" formControlName="date" class="form-control">
                <input *ngIf="type === 'modified'" type="datetime-local" formControlName="date" class="form-control">
              </div>
              <div class="edit-form-payment-sub-row-del">
                <button type="button" (click)="removePayment(i, j)">&times;</button>
              </div>
            </div>
          </div>
          <div class="edit-form-payment-sub-row-add">
            <button type="button" (click)="addPayment(i)" class="btn btn-add">Додати платіж</button>
          </div>
        </div>
        <div class="edit-form-payment-row-del">
          <button type="button" (click)="removePrice(i)">&times;</button>
        </div>
      </div>
    </div>
    <div class="edit-form-payment-row-add">
      <button type="button" (click)="addPrice()" class="btn btn-add">Додати гонорар</button>
    </div>
    <div class="edit-form-payment-submit">
      <button type="submit" class="btn btn-primary">Зберегти</button>
    </div>
  </div>
</form>
<div *ngIf="pendingModal" class="edit-form-payment-preloader">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><radialGradient id="a12" cx=".66" fx=".66" cy=".3125" fy=".3125" gradientTransform="scale(1.5)"><stop offset="0" stop-color="#4C5D52"></stop><stop offset=".3" stop-color="#4C5D52" stop-opacity=".9"></stop><stop offset=".6" stop-color="#4C5D52" stop-opacity=".6"></stop><stop offset=".8" stop-color="#4C5D52" stop-opacity=".3"></stop><stop offset="1" stop-color="#4C5D52" stop-opacity="0"></stop></radialGradient><circle transform-origin="center" fill="none" stroke="url(#a12)" stroke-width="15" stroke-linecap="round" stroke-dasharray="200 1000" stroke-dashoffset="0" cx="100" cy="100" r="70"><animateTransform type="rotate" attributeName="transform" calcMode="spline" dur="2" values="360;0" keyTimes="0;1" keySplines="0 0 1 1" repeatCount="indefinite"></animateTransform></circle><circle transform-origin="center" fill="none" opacity=".2" stroke="#4C5D52" stroke-width="15" stroke-linecap="round" cx="100" cy="100" r="70"></circle></svg>
</div>
